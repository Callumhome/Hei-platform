services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hei-api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hei-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: hei-db
    environment:
      POSTGRES_DB: hei
      POSTGRES_USER: hei
      POSTGRES_PASSWORD: hei_dev_password
    volumes:
      - hei_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hei -d hei"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hei-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hei_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  hei_postgres_data:
  hei_redis_data:
