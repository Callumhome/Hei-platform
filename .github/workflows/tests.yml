name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./hei_ci.db
      - name: Run backend tests
        run: PYTHONPATH=backend pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js
      - name: Verify frontend deployment files
        run: test -s frontend/index.html && test -s frontend/styles.css && test -s frontend/nginx.conf && test -s frontend/Dockerfile
